  - name: zai_paas
    base_url: https://api.z.ai/api/paas/v4
    key_env: ZAI_API_KEY
    default_model: glm-5.3
    discovery: native_first
    thinking_control: zai
    concurrency: 5
    models: *zai_models

  - name: openai
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    # OpenAI proper documents the `prompt_cache_key` routing hint (#673);
    # kept off for z.ai/Ollama until verified they tolerate the extra field.
    prompt_cache_key: true
    # ADR-0204: Chat Completions doesn't document accepting a call to an
    # undeclared function, so discovered tools go through `invoke`.
    discovery: invoke
    default_model: gpt-4o
    models:
      - id: gpt-4o
        display_name: GPT-4o
        context_window: 128000
        pricing:
          input: 2.5
          output: 10.0
          cached_input: 1.25
      - id: gpt-4-turbo
        display_name: GPT-4 Turbo
        context_window: 128000
        pricing:
          input: 10.0
          output: 30.0
      - id: gpt-3.5-turbo
        display_name: GPT-3.5 Turbo
        context_window: 16385
        pricing:
          input: 0.5
          output: 1.5

  - name: openai_responses
    # Opt-in (ADR-0196 §3, P7): the native Responses API surface, distinct
    # from `openai` above (Chat Completions). Selecting `openai` never picks
    # this up automatically — set ENTANGLEMENT_PROVIDER=openai_responses (or
    # a `providers.yml`/`config.yml` pin) to use it. `tool_search` (this
    # wire's client-executed discovery primitive) needs gpt-5.4 or later.
    wire: openai_responses
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    default_model: gpt-5.4
    models:
      - id: gpt-5.4
        display_name: GPT-5.4 (Responses)

  - name: ollama
    base_url: http://localhost:11434/v1
    default_model: llama3.1
    # Unprobed (ADR-0204): keeps ADR-0196's append-on-discovery until the
    # opt-in live tests show how local servers treat undeclared calls.
    discovery: append
    # `max_output_tokens` set explicitly (#483, deferred-work ledger row 5): with
    # it unset, entanglement sends no `max_tokens`, so Ollama falls back to its
    # own built-in `num_predict` default (128 tokens) — a generation cut so
    # short it used to surface as the ADR-0118 "announced intent then stream
    # died" ambiguous-stop symptom on nearly every non-trivial turn. Local
    # generation has no per-token cost, so these are generous, just kept under
    # each model's context window; override per-model in `providers.yml` if a
    # given local model needs more.
    models:
      - id: llama3.1
        display_name: Llama 3.1
        context_window: 128000
        max_output_tokens: 8192
      - id: llama3
        display_name: Llama 3
        context_window: 8192
        max_output_tokens: 2048
      - id: mistral
        display_name: Mistral
        context_window: 32768
        max_output_tokens: 4096

  - name: gemini
    wire: gemini
    key_env: GEMINI_API_KEY
    # ADR-0204: Gemini ends a round with UNEXPECTED_TOOL_CALL on an
    # undeclared function, so discovered tools go through `invoke`.
    discovery: invoke
    default_model: gemini-2.5-flash
    # Native Google Gemini wire (#309): `:streamGenerateContent`, not the
    # OpenAI-compat surface — the compat endpoint drops `thoughtSignature`, which a
    # 2.5 thinking model must round-trip on function calls. `base_url` unset → the
    # client's default generative-language `models` root (`GEMINI_BASE`). Pricing is
    # USD per million tokens (docs, standard <=200k-token context tier).
    models:
      - id: gemini-2.5-pro
        display_name: Gemini 2.5 Pro
        context_window: 1048576
        max_output_tokens: 65536
        supports_thinking: true
        default_temperature: 1.0
        pricing:
          input: 1.25
          output: 10.0
          cached_input: 0.31
      - id: gemini-2.5-flash
        display_name: Gemini 2.5 Flash
        context_window: 1048576
        max_output_tokens: 65536
        supports_thinking: true
        default_temperature: 1.0
        pricing:
          input: 0.3
          output: 2.5
          cached_input: 0.075

  - name: anthropic
    wire: anthropic
    key_env: ANTHROPIC_API_KEY
    default_model: claude-sonnet-5
    # Current generation (claude-api model reference, 2026-09-15). Facts the
    # wire depends on, all catalog data rather than client constants:
    # - `thinking_style: adaptive` on every 4.6+ model: those reject
    #   `thinking.budget_tokens` with a 400 (removed on Fable 5/5.1, Opus
    #   5/4.8/4.7 and Sonnet 5; deprecated on the 4.6 pair), so the
    #   fixed-budget default that suits claude-sonnet-4-5 / claude-haiku-4-5
    #   would break them. Depth is `reasoning_effort` (`output_config.effort`),
    #   clamped to `effort_tiers` — `xhigh` arrived with Opus 4.7.
    # - `supports_temperature: false` on Fable, Opus 5/4.8/4.7 and Sonnet 5:
    #   any sampling parameter is a 400 there, even one set live.
    # - `thinking_required: true` on Fable: thinking is always on server-side
    #   (an explicit disable is a 400); the client never sends a disable shape
    #   to any model, so this only documents the fact.
    # - `replay_thinking: true`: preserved-thinking models keep prior-turn
    #   thinking, so every captured block replays (ADR-0202).
    # - `web_search_tool_version: web_search_20260209` on the 4.6+ models; the
    #   budget-style holdovers keep the client's `_20250305` fallback.
    # `thinking_budget_tokens` stays unset everywhere; `max_output_tokens` is
    # generous because the cap covers thinking *and* the answer.
    models:
      - id: claude-fable-5-1
        display_name: Claude Fable 5.1
        context_window: 1000000
        max_output_tokens: 64000
        supports_thinking: true
        replay_thinking: true
        thinking_style: adaptive
        supports_temperature: false
        thinking_required: true
        effort_tiers: [low, medium, high, xhigh, max]
        web_search_tool_version: web_search_20260209
        pricing:
          input: 10.0
          output: 50.0
          cached_input: 0.25
          cache_write: 12.5
      - id: claude-fable-5
        display_name: Claude Fable 5
        context_window: 1000000
        max_output_tokens: 64000
        supports_thinking: true
        replay_thinking: true
        thinking_style: adaptive
        supports_temperature: false
        thinking_required: true
        effort_tiers: [low, medium, high, xhigh, max]
        web_search_tool_version: web_search_20260209
        pricing:
