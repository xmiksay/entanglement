# Embedded provider/model catalog — entanglement defaults.
#
# Deep-merged under an optional user override at
# `${dirs::config_dir}/entanglement/providers.yml` (override the whole path via
# `ENTANGLEMENT_PROVIDERS_FILE`). Merge identity: providers by `name`, models by
# `id`. See `catalog.rs` for the schema and merge semantics.
#
# Pricing is USD per million tokens. Only well-documented public rates are
# filled in; unknown rates are left unset rather than invented. Ollama is local,
# so it carries no pricing.
#
# `rpm` (optional, per provider) is the requests-per-minute budget for that
# provider's endpoint bucket. It is left unset here — like unknown pricing — so
# each endpoint falls back to the client default (RetryConfig::rpm, 50);
# override per provider in your user `providers.yml` or via `{NAME}_RPM`.
#
# `concurrency` (optional, per provider) caps simultaneously in-flight requests
# to that provider's endpoint (the primary spawn-storm guard). Left unset here
# so each endpoint falls back to the client default (RetryConfig::concurrency,
# 3); override per provider in your user `providers.yml` or via
# `{NAME}_CONCURRENCY` (falls back to the global `ENTANGLEMENT_MAX_CONCURRENCY`
# when neither is set).
#
# `concurrency` on a *model* (#521, ADR-0140) layers a tighter, model-specific
# in-flight cap on top of the provider's own — some providers (z.ai) limit
# concurrency per model, not just per endpoint. Only set where documented;
# left unset elsewhere so an unknown model falls back to the provider/client
# cap instead of an invented guess. No env override at this level (v1;
# YAML-only, see ADR-0140) — model ids contain `.`/`-` so there is no clean
# `{NAME}_{MODEL}_CONCURRENCY` env spelling yet.
#
# Capability flags gate the generation-parameter channel (#191): the head sends a
# model's `default_temperature` only when `supports_temperature` (and the
# Anthropic wire drops a live-set temperature too when it is `false`), and a
# thinking budget only when `supports_thinking` AND `thinking_budget_tokens` is
# set. Budgets are left unset everywhere here. Reasoning depth is the
# `reasoning_effort` knob instead (ADR-0203): `default_reasoning_effort` seeds
# it per model, and `effort_tiers` lists the tiers a model accepts — unset
# passes any tier through, a list clamps to the nearest (ties round down), and
# the empty list `[]` means the model takes no effort field at all.
# `thinking_required: true` marks a model that cannot run with thinking off: an
# effort-less request still enables thinking at its lowest listed tier.
#
# Thinking is therefore NOT uniformly off by default: the z.ai entries carry
# `thinking_control: zai`, so every request sends an explicit
# `thinking: {type: enabled|disabled}` object, and their thinking-capable
# models default to `high` (z.ai's own server default, with no object sent,
# is `max`). Anthropic thinking stays opt-in via `reasoning_effort`, except
# Claude Fable, whose thinking is always on server-side.
#
# `thinking_format` (ADR-0191, OpenAI-compat only) says how a model emits its
# thinking: `fields` (the default — structured `reasoning`/`reasoning_content`
# delta fields, display-only) or `inline_tags` (`<think>…</think>` spans inline
# in `content`, the parser-less-server case; those spans route to the reasoning
# rail and never replay as assistant text). Unset everywhere in the embedded
# defaults — set it per model in your user `providers.yml` when serving such a
# model (e.g. a local qwen3.5).
#
# Provider order is also the key auto-detect priority (z.ai first).

providers:
  # z.ai is two catalog entries sharing one `ZAI_API_KEY` (ADR-0203): the
  # key *type* decides which endpoint accepts it. `zai` is the GLM Coding Plan
  # endpoint — a Coding Plan subscription key — and stays FIRST, so key
  # auto-detect keeps selecting it. `zai_paas` is the pay-as-you-go endpoint —
  # a general API-balance key, which the Coding Plan URL rejects — selected
  # explicitly (`ENTANGLEMENT_PROVIDER=zai_paas`; its env overrides follow the
  # entry name: `ZAI_PAAS_MODEL`, `ZAI_PAAS_API_BASE`, …). The model list is
  # shared via a YAML anchor (`&zai_models` / `*zai_models`); a user override
  # on either entry merges into that entry alone. The bundled MCP servers stay
  # on `zai` ONLY: the runtime gathers bundles from every catalog entry keyed
  # by server name, so a second copy would overwrite this one (last entry
  # wins), and since both entries share `ZAI_API_KEY` the servers are already
  # available whichever entry is selected. Different base URLs ⇒ two
  # independent endpoint pools (ADR-0050).
  - name: zai
    base_url: https://api.z.ai/api/coding/paas/v4
    key_env: ZAI_API_KEY
    default_model: glm-5.3
    # ADR-0204: a discovery never mutates `tools` (one appended tool is a
    # full cache miss on z.ai); GLM-5.x reaches discovered tools through the
    # `invoke` fallback, the flash models call them natively.
    discovery: native_first
    # Send z.ai's explicit `thinking: {type: enabled|disabled}` object (plus
    # the clamped `reasoning_effort`) on every request — without it z.ai
    # silently thinks at `max` on every GLM-5.x turn.
    thinking_control: zai
    # z.ai's own documented endpoint-wide ceiling (#550) — without this the
    # endpoint fell back to the client's generic default of 3, *below*
    # glm-5.2's own model-level cap of 5 below, so `model_slot` warned "model
    # concurrency cap exceeds the endpoint's own" on every process's first
    # request and the model cap could never actually be reached.
    concurrency: 5
    # Provider-bundled MCP servers (#542): z.ai's first-party tool servers,
    # reachable with the same ZAI_API_KEY (docs.z.ai/devpack/mcp, fetched
    # 2026-08-01). Default state is `allowed` — available for per-session
    # enablement (`/enable mcp <name>` or the agent's `mcp_enable` tool) when
    # the key resolves, silently absent otherwise. Override per server in your
    # `config.yml` `mcp:` section (merge by name): `state: enabled` connects at
    # startup, `state: disabled` hides one. The capability hints (#426) mark
    # every tool read-only so a bare `read: allow` permission rule covers them.
    mcp_servers:
      web_search_prime:
        url: https://api.z.ai/api/mcp/web_search_prime/mcp
        headers:
          Authorization: "Bearer ${ZAI_API_KEY}"
        capabilities:
          webSearchPrime: read
      web_reader:
        url: https://api.z.ai/api/mcp/web_reader/mcp
        headers:
          Authorization: "Bearer ${ZAI_API_KEY}"
        capabilities:
          webReader: read
      zread:
        url: https://api.z.ai/api/mcp/zread/mcp
        headers:
          Authorization: "Bearer ${ZAI_API_KEY}"
        capabilities:
          search_doc: read
          read_file: read
          get_repo_structure: read
    # Full z.ai text palette (docs.z.ai/guides/overview/pricing and the
    # chat-completion API reference, fetched 2026-09-15). glm-5.3 leads — the
    # `default_model` above; `builtin_parses` asserts the ordering. Pricing is
    # USD per million tokens (input / output / cached_input). Free tiers carry
    # explicit zeros. `supports_thinking` is true everywhere except the
    # non-reasoning glm-4-32b-0414-128k. Effort: GLM-5.3/5.3-Flash accept only
    # `low|high|max` and cannot disable thinking; the rest of the 5.x family
    # takes every tier; the 4.x family enables thinking but takes no
    # `reasoning_effort` field (`effort_tiers: []`). (4.7-flash/flashx limits
    # assumed = the 4.7 family; not individually documented.)
    models: &zai_models
      - id: glm-5.3
        display_name: GLM-5.3
        context_window: 1000000
        max_output_tokens: 128000
        supports_thinking: true
        default_temperature: 0.7
        thinking_required: true
        effort_tiers: [low, high, max]
        default_reasoning_effort: high
        pricing:
          input: 1.4
          output: 4.4
          cached_input: 0.26
      - id: glm-5.3-flash
        display_name: GLM-5.3-Flash
        context_window: 1000000
        max_output_tokens: 128000
        supports_thinking: true
        default_temperature: 0.7
        thinking_required: true
        effort_tiers: [low, high, max]
        default_reasoning_effort: high
        pricing:
          input: 0.15
          output: 0.5
          cached_input: 0.03
      - id: glm-5.2
        display_name: GLM-5.2
        context_window: 1000000
        max_output_tokens: 131072
        supports_thinking: true
        default_temperature: 0.7
        effort_tiers: [low, medium, high, xhigh, max]
        default_reasoning_effort: high
        # z.ai-documented per-model in-flight cap (#521): 5 concurrent streams.
        concurrency: 5
        pricing:
          input: 1.4
          output: 4.4
          cached_input: 0.26
      - id: glm-5.1
        display_name: GLM-5.1
        context_window: 204800
        max_output_tokens: 131072
        supports_thinking: true
        default_temperature: 0.7
        effort_tiers: [low, medium, high, xhigh, max]
        default_reasoning_effort: high
        pricing:
          input: 1.4
          output: 4.4
          cached_input: 0.26
      - id: glm-5
        display_name: GLM-5
        context_window: 204800
        max_output_tokens: 131072
        supports_thinking: true
        default_temperature: 0.7
        effort_tiers: [low, medium, high, xhigh, max]
        default_reasoning_effort: high
        pricing:
          input: 1.0
          output: 3.2
          cached_input: 0.20
      - id: glm-4.7
        display_name: GLM-4.7
        context_window: 204800
        max_output_tokens: 131072
        supports_thinking: true
        default_temperature: 0.7
        effort_tiers: []
        default_reasoning_effort: high
        pricing:
          input: 0.6
          output: 2.2
          cached_input: 0.11
      - id: glm-4.7-flashx
        display_name: GLM-4.7-FlashX
        context_window: 204800
        max_output_tokens: 131072
        supports_thinking: true
        default_temperature: 0.7
        effort_tiers: []
        default_reasoning_effort: high
        pricing:
          input: 0.07
          output: 0.4
          cached_input: 0.01
      - id: glm-4.7-flash
        display_name: GLM-4.7-Flash
        context_window: 204800
        max_output_tokens: 131072
        supports_thinking: true
        default_temperature: 0.7
        effort_tiers: []
        default_reasoning_effort: high
        # z.ai-documented per-model in-flight cap (#521): only 1 concurrent
        # stream — far tighter than the endpoint-level default.
        concurrency: 1
        pricing:
          input: 0.0
          output: 0.0
          cached_input: 0.0
      - id: glm-4.6
        display_name: GLM-4.6
        context_window: 204800
        max_output_tokens: 131072
        supports_thinking: true
        default_temperature: 0.7
        effort_tiers: []
        default_reasoning_effort: high
        pricing:
          input: 0.6
          output: 2.2
          cached_input: 0.11
      - id: glm-4.5
        display_name: GLM-4.5
        context_window: 131072
        max_output_tokens: 98304
        supports_thinking: true
        default_temperature: 0.7
        effort_tiers: []
        default_reasoning_effort: high
        pricing:
          input: 0.6
          output: 2.2
          cached_input: 0.11
      - id: glm-4.5-x
        display_name: GLM-4.5-X
        context_window: 131072
        max_output_tokens: 98304
        supports_thinking: true
        default_temperature: 0.7
        effort_tiers: []
        default_reasoning_effort: high
        pricing:
          input: 2.2
          output: 8.9
          cached_input: 0.45
      - id: glm-4.5-air
        display_name: GLM-4.5-Air
        context_window: 131072
        max_output_tokens: 98304
        supports_thinking: true
        default_temperature: 0.7
        effort_tiers: []
        default_reasoning_effort: high
        pricing:
          input: 0.2
          output: 1.1
          cached_input: 0.03
      - id: glm-4.5-airx
        display_name: GLM-4.5-AirX
        context_window: 131072
        max_output_tokens: 98304
        supports_thinking: true
        default_temperature: 0.7
        effort_tiers: []
        default_reasoning_effort: high
        pricing:
          input: 1.1
          output: 4.5
          cached_input: 0.22
      - id: glm-4.5-flash
        display_name: GLM-4.5-Flash
        context_window: 131072
        max_output_tokens: 98304
        supports_thinking: true
        default_temperature: 0.7
        effort_tiers: []
        default_reasoning_effort: high
        pricing:
          input: 0.0
          output: 0.0
          cached_input: 0.0
      - id: glm-4-32b-0414-128k
        display_name: GLM-4-32B-0414-128K
