# auto: unattended run (ADR-0207 §11; ADR-0209, amended by ADR-0228 and
# ADR-0247). "Unattended" below means: no head watches the session or any
# of its ancestors. With the TUI up, or a `serve` client owning the root,
# the session is attended — whatever asks parks at once, as in `build`,
# and waits for the answer with no `question_timeout`.
# `default: allow` — `auto` lets everything run that its `deny` list below
# does not refuse: direct calls and a script's nested calls alike (one rule
# set, ADR-0228), a `rhai` launch included (no card, Ask per command — and
# with nothing left to ask, every nested call that is not denied runs).
#
# ADR-0209 had `default: prompt`, so an unlisted call collapsed to a refusal
# first and parked a bounded approval on a repeat (`question_timeout`). In
# practice that made `auto` stop on every unenumerated command; the user
# decided (#820) that `auto` means "run". What still asks here:
#   - the `prompt:` list below — destructive families that are recoverable
#     enough to approve but must never run silently;
#   - the escape-root gate (a path outside the project root, ADR-0109) —
#     unattended it parks up to `question_timeout`, then refuses;
#   - a credentialed `http()` call's per-host approval (ADR-0227) —
#     unattended it is refused unless an explicit user-layer `http(...)`
#     allow rule names it;
#   - a `write`/`edit`/`apply_patch` of a trusted script or a skill's
#     `SKILL.md`/`lib.rhai` (ADR-0228's write floor, every mode).
# A `prompt` rule's call follows ADR-0207 §11's ladder: unattended, the first
# call collapses to a refusal and a repeat graded by the same rule (ADR-0247:
# `rm -r x` then `rm -r x 2>&1` both hit `bash(rm -r*)`) parks up to
# `question_timeout`, then refuses.
#
# The `deny` entries are what an unattended run refuses outright with no
# escalation path, so everything genuinely irreversible belongs there; the
# `prompt` entries are destructive but worth one human look. Exec is no
# longer an explicit allow list: the `allow` entries are kept as the
# documentation of what this mode was built for, and the shared read-only
# set (`readonly_exec.yml`) is still spliced in by `builtin.rs`.
default: allow
deny:
  - plan
  - "bash(rm -rf /*)"
  - "bash(rm -rf ~*)"
  - "bash(git push*)"
  - "bash(git reset --hard*)"
  - "bash(git clean -f*)"
  - "bash(git branch -D*)"
  # Network-mutating commands: outward effects nobody is watching to
  # approve, so `auto` denies them outright rather than prompting (a prompt
  # would just time out unanswered, ADR-0207 §11). Each entry outranks the
  # broader allow it would otherwise fall through to under longest-match —
  # `gh api *`/`glab api *` (`readonly_exec.yml`, spliced into `allow` here)
  # for the two `api` families, `cargo *` (this file's own `allow`) for
  # `cargo publish`. `git push*` above already covers plain push; the rest
  # have no broader allow to out-rank but are listed for the same reason the
  # destructive entries above are: cheap, and still holding if a user tunes
  # `exec` on. This is the `deny` twin of `readonly_exec_prompt.yml`
  # (`build.yml` and the `research`/`plan` splice use `prompt` for the same
  # commands) — `auto` can't reuse that list since it needs a different
  # grade.
  - "bash(gh pr create*)"
  - "bash(gh pr merge*)"
  - "bash(gh issue create*)"
  - "bash(gh release create*)"
  - "bash(gh repo create*)"
  - "bash(gh api -X POST*)"
  - "bash(gh api -X PUT*)"
  - "bash(gh api -X PATCH*)"
  - "bash(gh api -X DELETE*)"
  - "bash(gh api --method POST*)"
  - "bash(gh api --method PUT*)"
  - "bash(gh api --method PATCH*)"
  - "bash(gh api --method DELETE*)"
  - "bash(glab mr create*)"
  - "bash(glab mr merge*)"
  - "bash(glab issue create*)"
  - "bash(glab release create*)"
  - "bash(glab api -X POST*)"
  - "bash(glab api -X PUT*)"
  - "bash(glab api -X PATCH*)"
  - "bash(glab api -X DELETE*)"
  - "bash(glab api --method POST*)"
  - "bash(glab api --method PUT*)"
  - "bash(glab api --method PATCH*)"
  - "bash(glab api --method DELETE*)"
  - "bash(npm publish*)"
  - "bash(cargo publish*)"
# Destructive, silent under `default: allow` without these. Each out-ranks
# the broader allow it would otherwise match (the shared `gh`/`glab` read
# set, `bash(cargo *)`) by length; the absolute `rm -rf /*`/`~*` denies above
# out-rank the `rm` entries the same way. The `rm` spellings are a
# best-effort list — a shell command line cannot be fully enumerated.
prompt:
  - "bash(gh issue delete*)"
  - "bash(gh repo delete*)"
  - "bash(gh release delete*)"
  - "bash(gh label delete*)"
  - "bash(gh secret delete*)"
  - "bash(gh variable delete*)"
  - "bash(gh run delete*)"
  - "bash(gh cache delete*)"
  - "bash(gh gist delete*)"
  - "bash(glab repo delete*)"
  - "bash(glab issue delete*)"
  - "bash(glab mr delete*)"
  - "bash(glab release delete*)"
  - "bash(glab label delete*)"
  - "bash(glab variable delete*)"
  - "bash(cargo yank*)"
  - "bash(npm unpublish*)"
  - "bash(docker push*)"
  - "bash(rm -r*)"
  - "bash(rm -R*)"
  - "bash(rm -f -r*)"
  - "bash(rm -f -R*)"
  - "bash(rm -fr*)"
  - "bash(rm -fR*)"
  - "bash(rm --recursive*)"
  - "bash(rm -f --recursive*)"
allow:
  - read
  # Spawning (`agent`/`agent_send`, Capability::Control) is graded like any
  # tool (ADR-0232) and allowed by default; `deny: [agent]` in config.yml
  # `modes:` names the tool and so outranks this class allow.
  - control
  - write
  - "bash(cargo *)"
  - "bash(make *)"
max_depth: 2
max_agents: 4
question_timeout: 60
# Sandbox is deliberately NOT declared here. ADR-0104 shipped bubblewrap as an
# *opt-in* (`ENTANGLEMENT_SANDBOX=bwrap`); declaring it in every built-in mode
# silently made it mandatory, which broke ordinary work — a confined `git push`
# fails with "Bad owner or permissions on /etc/ssh/ssh_config.d/…" because the
# namespace changes the ownership ssh sees on its own config. The mechanism
# stays (a mode may declare `sandbox:`, and ENTANGLEMENT_SANDBOX may only
# tighten it, ADR-0207 §6) — the shipped defaults just don't turn it on.
