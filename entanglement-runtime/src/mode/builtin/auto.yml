# auto: unattended run (ADR-0207 §11). `default: deny` is load-bearing here,
# not decoration: nobody is watching, so anything not explicitly listed is
# refused and the turn continues rather than parking a prompt that will never
# be answered. That is why exec is an explicit command list instead of the
# `exec` capability class — a class allow would mean `default: deny` never
# fires and the deny list below became the only guard, leaving anything
# harmful nobody thought to enumerate permitted. `bash` and `call` share
# these rules (ADR-0207 §4), so one spelling covers both.
#
# The deny entries stay even though exec is not class-allowed: they cost
# nothing and keep holding if a user tunes `exec` on via `config.yml`.
default: deny
deny:
  - plan
  - "bash(rm -rf /*)"
  - "bash(rm -rf ~*)"
  - "bash(git push*)"
  - "bash(git reset --hard*)"
  - "bash(git clean -f*)"
  - "bash(git branch -D*)"
allow:
  - read
  - write
  - "bash(cargo *)"
  - "bash(make *)"
  - "bash(git status)"
  - "bash(git diff *)"
  - "bash(git log *)"
max_depth: 2
max_agents: 4
question_timeout: 60
sandbox: bwrap
