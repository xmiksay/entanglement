# auto: unattended run (ADR-0207 §11, amended by ADR-0209). `default: prompt`
# — not `deny` — because the unattended guarantee comes from
# `question_timeout`, never from the default grade.
#
# The original cut spelled this `default: deny`, reasoning that nobody is
# watching so anything unlisted should be refused outright rather than park a
# prompt that will never be answered. That reasoning was right about
# *parking* and wrong about the *grade*. A `Deny` is absolute — it takes
# dispatch's `Permission::Deny` arm and replies immediately — so it bypassed
# the very escalation ADR-0207 §11 built for this mode:
# `run_limits::collapses_ask` refuses a first `Ask` *without* parking, and
# `DenialTracker::record_repeat` parks a bounded approval on a **second**
# identical call, "since a model insisting twice may genuinely need it".
# With `default: deny` that path was unreachable for every command not
# explicitly enumerated — i.e. nearly all of them — so an attended `auto`
# session could never approve anything, and a model's correct retry was
# refused identically forever.
#
# `default: prompt` restores the ladder without weakening the posture,
# because the timeout does the work: genuinely unattended, the first call
# collapses to a denial, the second parks, nobody answers, and
# `on_timeout: deny` refuses it 60s later — the same outcome, one prompt
# later. Attended, the user gets to decide.
#
# What stays: the `deny` list below is absolute regardless of the default,
# and exec is still an **explicit command list**, never the `exec` capability
# class. That distinction is the one ADR-0207 §11 actually needed — a class
# allow would run unenumerated commands *silently*, which is a different
# thing from prompting for them. `bash` and `call` share these rules
# (ADR-0207 §4), so one spelling covers both.
#
# The exec allow list is the shared read-only set (`readonly_exec.yml`,
# spliced in by `builtin.rs`) plus this mode's own build-tooling extras —
# it used to carry its own hand-copied read-only subset that disagreed with
# `research`'s (different git coverage, no `sed`/`awk`/`diff`); that drift
# is exactly what a single shared list removes.
#
# The `deny` entries below carry more weight under `default: prompt` than
# they did under `default: deny`: they are now the only grade an unattended
# run refuses *without* an escalation path, so everything genuinely
# irreversible belongs there rather than relying on the default.
default: prompt
deny:
  - plan
  - "bash(rm -rf /*)"
  - "bash(rm -rf ~*)"
  - "bash(git push*)"
  - "bash(git reset --hard*)"
  - "bash(git clean -f*)"
  - "bash(git branch -D*)"
  # Network-mutating commands: outward effects nobody is watching to
  # approve, so `auto` denies them outright rather than prompting (a prompt
  # would just time out unanswered, ADR-0207 §11). Each entry outranks the
  # broader allow it would otherwise fall through to under longest-match —
  # `gh api *`/`glab api *` (`readonly_exec.yml`, spliced into `allow` here)
  # for the two `api` families, `cargo *` (this file's own `allow`) for
  # `cargo publish`. `git push*` above already covers plain push; the rest
  # have no broader allow to out-rank but are listed for the same reason the
  # destructive entries above are: cheap, and still holding if a user tunes
  # `exec` on. This is the `deny` twin of `readonly_exec_prompt.yml`
  # (`build.yml` and the `research`/`plan` splice use `prompt` for the same
  # commands) — `auto` can't reuse that list since it needs a different
  # grade.
  - "bash(gh pr create*)"
  - "bash(gh pr merge*)"
  - "bash(gh issue create*)"
  - "bash(gh release create*)"
  - "bash(gh repo create*)"
  - "bash(gh api -X POST*)"
  - "bash(gh api -X PUT*)"
  - "bash(gh api -X PATCH*)"
  - "bash(gh api -X DELETE*)"
  - "bash(gh api --method POST*)"
  - "bash(gh api --method PUT*)"
  - "bash(gh api --method PATCH*)"
  - "bash(gh api --method DELETE*)"
  - "bash(glab mr create*)"
  - "bash(glab mr merge*)"
  - "bash(glab issue create*)"
  - "bash(glab release create*)"
  - "bash(glab api -X POST*)"
  - "bash(glab api -X PUT*)"
  - "bash(glab api -X PATCH*)"
  - "bash(glab api -X DELETE*)"
  - "bash(glab api --method POST*)"
  - "bash(glab api --method PUT*)"
  - "bash(glab api --method PATCH*)"
  - "bash(glab api --method DELETE*)"
  - "bash(npm publish*)"
  - "bash(cargo publish*)"
allow:
  - read
  - write
  - "bash(cargo *)"
  - "bash(make *)"
max_depth: 2
max_agents: 4
question_timeout: 60
# Sandbox is deliberately NOT declared here. ADR-0104 shipped bubblewrap as an
# *opt-in* (`ENTANGLEMENT_SANDBOX=bwrap`); declaring it in every built-in mode
# silently made it mandatory, which broke ordinary work — a confined `git push`
# fails with "Bad owner or permissions on /etc/ssh/ssh_config.d/…" because the
# namespace changes the ownership ssh sees on its own config. The mechanism
# stays (a mode may declare `sandbox:`, and ENTANGLEMENT_SANDBOX may only
# tighten it, ADR-0207 §6) — the shipped defaults just don't turn it on.
