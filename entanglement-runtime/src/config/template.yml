# entanglement — user configuration.
#
# This starter file was scaffolded on first run (#219). Every setting is a
# fallback and every line below is commented out, so this file changes nothing
# until you edit it: uncomment a key and give it a value to override the built-in
# default. An explicit CLI flag or environment variable always wins over this
# file (env > config > embedded default).
#
# Layered like every other definition in the codebase (ADR-0047):
#   embedded default  <  this file  <  <root>/.entanglement/config.yml
# Later layers win; mappings merge key-wise, scalars are replaced. A malformed
# file is a loud error, never a silent fallback.

# Default agent profile when none is passed on the CLI (`--agent`).
# One of: general | plan | debug (or any custom agent you define).
#agent: general

# Default permission mode when none is passed on the CLI (`--mode`), ADR-0207.
# One of: research | plan | build | auto. Leave commented for the engine's own
# default ("build").
#mode: research

# Provider selection, mirroring ENTANGLEMENT_PROVIDER
# (zai | zai_paas | openai | ollama | anthropic | echo | any catalog name).
# `zai` is the GLM Coding Plan endpoint; a pay-as-you-go z.ai key needs
# `zai_paas` (same ZAI_API_KEY).
# Leave commented to auto-detect by which API key is present.
#provider: zai

# Model id override. Leave commented for the selected provider's catalog default
# (or its {NAME}_MODEL env var, which still wins).
#model: glm-5.3

# Log at `debug` by default, as `--verbose` does (RUST_LOG always wins).
#verbose: false

# Permissions — a global ceiling clamped least-privilege against the session's
# own permission mode (ADR-0207 stage 6c): a rule here can only *tighten* what
# a mode allows, never loosen it. Same grammar a mode body uses: `default` sets
# the fallback grade, `allow`/`deny`/`prompt` add rules — a tool name, `*`, a
# capability class (read | write | exec | plan | control), or a scoped
# `tool(pattern)`/`tool{pattern}`. Longest matching key wins. The built-in
# default is allow-all, so an untouched block changes nothing.
#permissions:
#  default: allow
#  prompt: [bash]
#  deny: ["bash(rm *)"]

# Per-mode tuning (ADR-0207 §5) — adds allow/deny/prompt rules onto one of the
# four built-in modes (research | plan | build | auto). There is no syntax to
# define a fifth mode, or to remove a shipped rule (add a longer, more specific
# rule instead — it out-ranks a shorter shipped one).
#modes:
#  research:
#    allow: ["bash(cargo check)"]

# Lifecycle hooks — external commands run around tool execution and on prompt
# ingress (policy / telemetry / formatting). Each command runs via `sh -c` with
# the event JSON on stdin and ENTANGLEMENT_HOOK_EVENT / _SESSION_ID / _TOOL_NAME
# in the env. `tools` (tool hooks only) scopes a hook to named tools; omit for
# all. `timeout_secs` defaults to 30.
#   pre_tool_use       — before a tool runs; a NON-ZERO EXIT BLOCKS the tool.
#   post_tool_use      — after the result; observational side-effect only.
#   user_prompt_submit — when a prompt arrives; observational.
# Observe-only lifecycle points (none can block; payload fields in brackets):
#   session_start      — a session started [source: fresh|resume|compact].
#   session_end        — it left memory [reason: closed|hibernated|compacted].
#   stop               — a root session's turn finished [reason: completed|error].
#   subagent_stop      — a spawned child's turn finished [parent, agent].
#   pre_compact        — a compaction was announced [kind: manual|auto|prune].
#   notification       — an approval / ask_user question parked [kind, message].
#hooks:
#  pre_tool_use:
#    - command: "jq -e '.input.command | test(\"rm -rf\") | not'"
#      tools: [bash]
#  post_tool_use:
#    - command: "jq -r '.input.path' | xargs -r prettier --write"
#      tools: [write, edit]
#  user_prompt_submit:
#    - command: "logger -t entanglement-prompt"
#  notification:
#    - command: "jq -r .message | xargs -0 notify-send entanglement"
#  stop:
#    - command: "jq -c . >> ~/.local/state/entanglement-turns.jsonl"

# MCP servers — attach external tool servers (#198, #312). Registered = available
# (ADR-0226): the model lists servers with `list_mcp`, reads one server's tools
# with `mcp_tools`, and calls them through `mcp(server, tool, args)` — every call
# graded by the session's permission mode like a host tool, named
# `mcp__<server>__<tool>` in rules. Nothing connects at startup: the first
# `mcp_tools`/`mcp(...)` on a server connects it, and a failed connect is a tool
# error, never fatal. Each block picks ONE transport — `command` XOR `url`:
#
#   stdio (local subprocess, JSON-RPC over stdio):
#     command   — executable to spawn (looked up on PATH)
#     args      — argument list (default [])
#     env       — extra environment variables (default {})
#   http (remote, streamable-HTTP transport — needs the `mcp-http` build feature):
#     url       — the server's endpoint (e.g. https://example.com/mcp)
#     headers   — static request headers; values may use ${VAR} from the env
#     oauth     — (ADR-0153) present — even empty ({}) — it switches the server
#                 from static headers to a browser-obtained bearer token, with
#                 full endpoint discovery + dynamic client registration; fields
#                 inside are overrides (authorization_url + token_url skips
#                 discovery). Authenticate with `/mcp connect <name>`; tokens
#                 persist in the managed mcp-tokens.yml.
#
#   description  — one line `list_mcp` shows for the server
#   disabled     — the one opt-out: a disabled server is never listed or
#                  connected. Provider-bundled servers (z.ai web_search_prime /
#                  web_reader / zread, unlocked by ZAI_API_KEY) are on while the
#                  key resolves; a same-name entry here overrides them
#                  field-wise — e.g. `zread: { disabled: true }` hides one.
#                  (The old three-state `state:` key is retired, ADR-0226.)
#   capabilities — (#426) map a server's raw tool name to `read`/`write`/`call`.
#                  Every MCP tool currently grades as the fail-safe
#                  Capability::Write regardless of this hint (ADR-0207 §3 left
#                  per-server capability declarations for a later stage), so a
#                  bare `permissions: { deny: [write] }` above already covers
#                  every MCP tool either way; this hint has no effect on that
#                  grading yet.
#mcp:
#  everything:
#    command: npx
#    args: ["-y", "@modelcontextprotocol/server-everything"]
#    env:
#      EXAMPLE_TOKEN: "…"
#    capabilities:
#      search: read
#  my-remote:
#    url: https://example.com/mcp
#    headers:
#      Authorization: "Bearer ${MY_MCP_TOKEN}"
#  my-oauth:
#    url: https://example.com/mcp
#    oauth: {}

# Hidden credentials for the rhai `http(method, url, #{headers, body})`
# binding (ADR-0227). Maps a host to headers/cookies the runtime injects at
# send time; the script never sees them and neither does the model. USER LAYER
# ONLY — a project `.entanglement/config.yml` declaring `http_auth:` is ignored
# with a warning (a repo's script must not spend your tokens). Rules:
#   - a key matches the URL host exactly or as a dot-boundary suffix
#     (`github.com` covers `api.github.com`, never `github.com.evil.io`);
#     the longest matching key wins; paths are never matched
#   - injected over https only, never on a redirect to another host
#   - `${VAR}` in a value resolves from the environment, where the managed
#     `.env` (ENTANGLEMENT_ENV_FILE) lands at startup
#   - a script that sets Authorization/Cookie itself is refused
#   - the first credentialed call to a host in a session always asks
#     (`authenticated for <host>`), whatever the mode grades; `auto` refuses it
#     unless an explicit `http(...)` rule in THIS file allows it, e.g.
#     modes: {auto: {allow: ["http(GET https://api.github.com/*)"]}}
#   - the referenced variables are scrubbed from every child's environment
#     (bash, hooks, MCP servers, ...); the managed .env file itself and this
#     process's /proc environ stay readable by bash — an accepted risk shared
#     with provider keys (#832)
#   - read at startup only: editing this section needs a restart
#http_auth:
#  api.github.com:
#    headers:
#      Authorization: "Bearer ${GITHUB_TOKEN}"
#  example.com:
#    cookies:
#      session: "${EXAMPLE_SESSION}"

# Web search — opt-in, provider-side (#305). When enabled, the provider runs a
# web search MID-TURN, server-side (z.ai `zai`/`zai_paas` and Anthropic only), and cites the
# results; there is no client tool round-trip. ENABLING THIS IS YOUR CONSENT: the
# search runs provider-side, OUTSIDE the runtime permission ladder — no per-call
# approval prompt gates it. Results surface as reasoning lines, not persisted into
# conversation history (ADR-0075). Disabled by default.
#   max_uses        — cap the searches per turn (default: the provider's own).
#   allowed_domains — restrict searches to these domains (default: no restriction).
#web_search:
#  enabled: true
#  max_uses: 5
#  allowed_domains: [docs.rs, doc.rust-lang.org]

# Cap on the inner LLM→tool loop within a single turn (#177): the max number of
# LLM round-trips (each possibly fanning out into tool calls) before a runaway
# turn is halted. The counter resets per prompt, so a long session of many short
# prompts is never capped — only a single wedged turn. Default 200.
#max_turns: 200

# Auto-hibernate a settled session (no in-flight turn, and none in its spawned
# sub-tree) after this many idle seconds (#401, ADR-0090). Evicts the session's
# in-memory state without tombstoning it — `Holly::resume` rebuilds it from the
# event log on its next message. Leave commented to disable the sweep entirely
# (the default): eviction then stays embedder-driven. Mainly useful for a
# long-lived multi-session embedder such as `skutter serve`; a background sweep
# never touches a session mid-turn, so this can't cancel in-flight work.
#idle_ttl_secs: 1800

# Auto-summarize on context overflow (#398, ADR-0103). Leave commented for the
# default (enabled): when a turn's history outgrows the model's input budget
# (85% of its context window), the engine summarizes the oldest history in
# place — keeping the last few messages verbatim — and continues the same turn.
# Set to false to skip that extra LLM round-trip: the engine then only prunes
# the oldest tool outputs to placeholders and, if that still doesn't fit,
# refuses the turn ("start a new session or shorten the request").
#auto_compact: false

# Editor the TUI opens for `/editor` (the $EDITOR round-trip). When set, this
# WINS OVER $VISUAL/$EDITOR — the persisted choice is the default regardless of
# the shell env. Leave commented to fall back to $VISUAL → $EDITOR → vi.
# Word-split like a shell command, so flags work, e.g. "code --wait".
#editor: nvim

# Session-log retention in days (Issue 4). On startup the TUI prunes `.jsonl`
# files in the current project's session dir whose mtime is older than this.
# Scope is this project's dir only — it never walks sibling project dirs, and a
# read-only data dir is logged and skipped (never fatal). Leave commented for
# the 30-day default.
#session_retention_days: 30

# File backups behind /undo and /rewind (ADR-0212): before write/edit/
# apply_patch replace a file, its prior content is kept beside the session
# log. A prior version over max_file_bytes, or past a root session's
# max_root_bytes stored budget, is recorded as skipped (undo reports it as not
# restorable). Sizes are bytes or a string with a unit: B, KB/MB/GB (x1000)
# or KiB/MiB/GiB (x1024), at most 64GiB. enabled: false records nothing new;
# backups already taken stay restorable. Picked up live for the next write.
#undo:
#  enabled: true
#  max_file_bytes: 8MiB
#  max_root_bytes: 256MiB

# Terminal-UI preferences (ADR-0213). A running TUI picks an edit up live.
#tui:
#  # Also send an OSC 9 desktop notification (not just the bell) when a turn
#  # needs your attention.
#  notify: false
#  # Capture the mouse (wheel scroll, clickable blocks). false gives the
#  # terminal back its native text selection.
#  mouse: true
#  # The always-visible top row: where this TUI is working. `template` is
#  # left-aligned, `right` right-aligned on the same row. Placeholders:
#  #   {repo} {cwd} {cwd_rel} {branch} {worktree} {session} {agent} {mode}
#  #   {model} {cost} {context_pct} {action} {tasks} {workdir}
#  # {repo} is the git repo name (the main repo's, inside a linked worktree;
#  # the ~-abbreviated path outside git), {cwd_rel} the path below the repo
#  # root, {branch} the branch or short sha (? when unreadable), {worktree}
#  # `[worktree: name]` in a linked worktree, {action} the narrated
#  # "what it is doing now", {tasks} done/total from the task list,
#  # {workdir} the session's /cd directory (empty at the project root).
#  # An empty placeholder disappears together with the text in front of it
#  # (and the text after the last placeholder goes with it too); an unknown
#  # {name} is shown literally and warned about once. On a narrow terminal
#  # the line sheds the session counters, then {tasks}/{cost}/{context_pct},
#  # {action}/{model}/{mode}/{agent}, {session}, {worktree}, {branch}, and
#  # finally middle-elides the path — {repo} always stays.
#  statusline:
#    template: "{repo} › {cwd_rel}  ⎇ {branch} {worktree}"
#    right: "{session}"
#    # Or let a script draw the left half: `sh -c` gets a JSON payload on
#    # stdin and its first stdout line replaces `template` (colours are
#    # stripped; `right` stays). Payload (v1, unknown facts are null):
#    #   {"v":1, "session", "cwd", "root", "repo", "branch", "worktree",
#    #    "agent", "mode", "model":{"id","name"}, "cost_usd", "context_pct",
#    #    "action", "tasks":{"done","total"}, "workdir"}
#    # Runs at most once a second, when something in the payload changes or
#    # a bash/call/rhai call finishes; killed after timeout_ms. A failure
#    # shows the template again (one toast). Provider API keys are removed
#    # from its environment.
#    #command: jq -r '"\(.repo // .cwd) ⎇ \(.branch // "-")  \(.context_pct // 0)%"'
#    #timeout_ms: 1000
#  # Colours: `dark` (default) or `light` (for light terminal backgrounds),
#  # or an object overriding named slots on top of a base. A colour is a
#  # named ANSI colour (cyan, dark_gray, light_red, white, default), "#rrggbb"
#  # or a 256-colour index (0-255). Slots: message.bg input.bg sidebar.bg
#  # sidebar.fg assistant reasoning tool.request tool.output text accent
#  # success warning error special info muted secondary selection.bg
#  # heading.fg heading.bg approval markdown.code diff.add diff.remove
#  # diff.context status.repo status.path status.branch status.worktree
#  # status.text status.dim status.attention. An unknown slot or bad colour
#  # is warned about once and keeps the base's colour. NO_COLOR=1 in the
#  # environment turns every colour off (bold/dim/reverse still mark things).
#  theme: dark
#  #theme:
#  #  base: light
#  #  slots:
#  #    status.branch: cyan
#  #    diff.add: "#2e7d32"
#  #    muted: 244
#  # Remap keys: action -> one key or a list (replacing that action's
#  # defaults; [] unbinds it). A key is [ctrl+][alt+][shift+]<key> — a single
#  # character or enter, tab, esc, backspace, delete, insert, home, end,
#  # pageup, pagedown, up, down, left, right, space, f1-f24 — or
#  # "leader <key>" for a chord after the leader. Actions and defaults:
#  #   leader ctrl+x            submit enter
#  #   newline [shift+enter, alt+enter, ctrl+j]
#  #   cycle_mode tab           cycle_mode_back shift+tab
#  #   scroll_up pageup         scroll_down pagedown
#  #   toggle_reasoning leader t     jump_attention ctrl+g
#  #   new_session leader n     list_sessions [leader l, ctrl+l]
#  #   pause_toggle ctrl+space  pick_agent [leader a, ctrl+a]
#  #   pick_model leader m      inspect leader i
#  #   toggle_sidebar leader s  open_editor leader e     export leader E
#  #   command_palette [leader p, ctrl+p]  interrupt leader c  quit leader q
#  #   help [leader ?, leader h]
#  # ctrl+c (interrupt / quit), ctrl+q (quit) and esc (cancel) are fixed, and
#  # a bare printable key can't be bound directly (jump_attention and
#  # list_sessions can't take enter/tab/arrows/page/home/end either). Two actions on one key, an
#  # unknown action or a bad key rejects the whole remap with one warning and
#  # the previous key map stays.
#  keybindings:
#    leader: ctrl+x
#    pick_model: [leader m, ctrl+o]
