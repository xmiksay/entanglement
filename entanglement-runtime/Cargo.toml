[package]
name = "entanglement-runtime"
description = "Embeddable runtime for the entanglement agent engine: tool execution, permission dispatch, sub-agent spawn and event-sourced persistence. No CLI, TUI or web-server deps; the `skutter` CLI is built on it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Document the full feature surface on docs.rs (the lean no-default-features
# library is a deliberate subset — ADR-0025).
[package.metadata.docs.rs]
all-features = true

[lib]
name = "entanglement_runtime"
path = "src/lib.rs"

# `mcp::HttpClient` (#312) is compiled out of the lean `--no-default-features`
# library `embedded.rs`/`embedded_lifecycle.rs` build against, so it needs its
# own example gated on the feature that carries it (#364).
[[example]]
name = "mcp_http"
path = "examples/mcp_http.rs"
required-features = ["mcp-http"]

[features]
default = ["provider", "mcp-http"]
# The throttle relay: it polls `entanglement-provider`'s `HttpClient`
# directly. The aux-LLM tasks (session titles, the narrator) moved to
# `skutter` (#932).
provider = ["dep:entanglement-provider"]
# Streamable-HTTP MCP transport (#312, ADR-0080): remote MCP servers over
# `POST /mcp` with per-server headers/auth and an OAuth bearer from the
# `TokenStore` (ADR-0153; the interactive flows are skutter's, #932). Since
# ADR-0153 the transport and the OAuth mechanism live in
# `entanglement-provider` and are reached through core's re-export, so this gate
# no longer pulls `reqwest`/`futures` as direct runtime deps — it now only decides
# whether the lean library compiles the HTTP-MCP code paths in at all. stdio MCP
# stays feature-free (tokio process only).
mcp-http = []

[dependencies]
entanglement-core = { workspace = true }
entanglement-provider = { workspace = true, optional = true }
# Per-crate feature trim (#502, ADR-0135): `rt`+`rt-multi-thread`+`macros`
# back the examples' `#[tokio::main]` (multi-threaded by default);
# `sync`/`time` the mpsc/broadcast/oneshot/watch + sleep/timeout/interval
# usage throughout; `process`/`io-util` mcp stdio and the exec helpers'
# piping; `net` the MCP transport tests' stub servers. The
# `tokio` dev-dependency adds only `test-util`.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "net", "io-util"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
# `load_skill`'s path-token rewrite.
regex = { workspace = true }
# Process-group kill on timeout/cancel (#168) and `O_NOFOLLOW` opens.
libc = { workspace = true }
async-trait = { workspace = true }
# `FileChange` audit content hash (#202). Pure Rust — rides in the lean library.
sha2 = { workspace = true }
# The `rhai` script tool's engine (ADR-0046) — native, no feature gate
# (#933): pure Rust, so it stays lean-build/cross-compile clean.
# `internals` for `AST::statements` — a skill `lib.rhai` must be fn-only
# (ADR-0227). Not `metadata`: it makes the parser reject any doc-style
# comment not followed by `fn`; lib doc comments are read as text
# (`skills::lib_docs`, ADR-0228).
rhai = { workspace = true, features = ["internals"] }
# The debounced file-watch primitive (`watch`, #329) behind `plan_watch`.
# Pure-Rust/inotify, no transport deps — rides in the lean library.
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Paused-clock tests (`tokio::time::pause`/`advance`) pin the attendance
# deadline's races deterministically (ADR-0247).
tokio = { workspace = true, features = ["test-util"] }
async-trait = { workspace = true }
futures = { workspace = true }
# Stub streamable-HTTP MCP servers in the `mcp-http` integration tests.
axum = { workspace = true }
