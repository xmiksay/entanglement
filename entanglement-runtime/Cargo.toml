[package]
name = "entanglement-runtime"
description = "Embeddable runtime for the entanglement agent engine: host tools, tool execution, permission dispatch, sub-agent spawn, user config and event-sourced persistence. No CLI, TUI or web-server deps; the `skutter` CLI is built on it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# Document the full feature surface on docs.rs (the lean no-default-features
# library is a deliberate subset — ADR-0025).
[package.metadata.docs.rs]
all-features = true

[lib]
name = "entanglement_runtime"
path = "src/lib.rs"

# `mcp::HttpClient` (#312) is compiled out of the lean `--no-default-features`
# library `embedded.rs`/`embedded_lifecycle.rs` build against, so it needs its
# own example gated on the feature that carries it (#364).
[[example]]
name = "mcp_http"
path = "examples/mcp_http.rs"
required-features = ["mcp-http"]

# The `rhai` tool integration suite needs the (now optional, #502) `rhai`
# feature — gated the same way `mcp_http` is gated above.
[[test]]
name = "rhai"
path = "tests/rhai.rs"
required-features = ["rhai"]

[features]
default = ["provider", "mcp-http", "rhai", "web-fetch"]
# The provider-backed aux-LLM helpers (session titles, the narrator, the
# throttle relay): they drain an `entanglement-provider` `LlmStream` for a
# one-shot call, and `futures::StreamExt` is the iterator.
provider = ["dep:entanglement-provider", "dep:futures"]
# Streamable-HTTP MCP transport (#312, ADR-0080): remote MCP servers over
# `POST /mcp` with per-server headers/auth, plus the OAuth flow that authenticates
# them (ADR-0153). Since ADR-0153 the transport and the OAuth mechanism live in
# `entanglement-provider` and are reached through core's re-export, so this gate
# no longer pulls `reqwest`/`futures` as direct runtime deps — it now only decides
# whether the lean library compiles the HTTP-MCP code paths in at all (matching
# how `serve` gates axum — ADR-0025). stdio MCP stays feature-free (tokio process
# only).
mcp-http = []
# The sandboxed `rhai` script tool (#122, ADR-0046; default-on, #502/ADR-0135
# amending ADR-0025): one of the heaviest always-compiled deps, so a lean
# embedder that never registers `rhai` can now drop it via
# `--no-default-features` (no `rhai` in that build's feature list). Every
# existing default-feature build (incl. `skutter`) is unaffected.
rhai = ["dep:rhai"]
# The SSRF-guarded `web_fetch` host tool (#736, ADR-0220; default-on). The
# fetch mechanism itself is provider-owned and always compiled; this gate
# carries only the tool and its HTML->Markdown converter (`htmd`, which pulls
# html5ever), so a lean embedder that never fetches pages can drop both.
web-fetch = ["dep:htmd", "dep:html5ever", "dep:markup5ever_rcdom"]

[dependencies]
entanglement-core = { workspace = true }
entanglement-provider = { workspace = true, optional = true }
# Per-crate feature trim (#502, ADR-0135): `rt`+`rt-multi-thread`+`macros`
# back the examples' `#[tokio::main]` and the one `flavor = "multi_thread"`
# test (`src/extra_roots.rs`); `sync`/`time` the mpsc/broadcast/oneshot/watch
# + sleep/timeout/interval usage throughout; `fs`/`process`/`io-util` the host
# tools (`host::edit`/`write`/`read`/`bash`/mcp stdio, the exec tools'
# piping); `net` the MCP transport tests' stub servers. The `tokio`
# dev-dependency adds only `test-util`.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "process", "net", "io-util"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
# The `provider` feature's one-shot aux-LLM drain.
futures = { workspace = true, optional = true }
dirs = { workspace = true }
# Host tool dependencies
glob = { workspace = true }
regex = { workspace = true }
ignore = { workspace = true }
# Process-group kill for the exec tool `bash` on timeout/cancel (#168).
libc = { workspace = true }
async-trait = { workspace = true }
# `FileChange` audit content hash (#202). Pure Rust — rides in the lean library.
sha2 = { workspace = true }
# `read` inline-base64-encodes an image file for its image content block (#221).
base64 = { workspace = true }
# `rhai` host tool — embedded sandboxed script engine (ADR-0046). Optional,
# default-on (behind the `rhai` feature, #502/ADR-0135): pure Rust so it stays
# lean-build/cross-compile clean when enabled, but is one of the heaviest
# always-compiled deps, so a lean embedder can opt out via
# `--no-default-features`.
# `internals` for `AST::statements` — a skill `lib.rhai` must be fn-only
# (ADR-0227). Not `metadata`: it makes the parser reject any doc-style
# comment not followed by `fn`; lib doc comments are read as text
# (`skills::lib_docs`, ADR-0228).
rhai = { workspace = true, optional = true, features = ["internals"] }
# HTML -> Markdown for `web_fetch` (behind the `web-fetch` feature, #736).
htmd = { workspace = true, optional = true }
markup5ever_rcdom = { workspace = true, optional = true }
html5ever = { workspace = true, optional = true }
# Advisory cross-process file lock for the managed read-modify-write writes
# (grants.yml / agent-models.yml / the env file, #329).
fd-lock = { workspace = true }
# Definitions-dir + managed-file watcher (#329). Pure-Rust/inotify, no
# transport deps — rides in the lean library.
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Paused-clock tests (`tokio::time::pause`/`advance`) pin the attendance
# deadline's races deterministically (ADR-0247).
tokio = { workspace = true, features = ["test-util"] }
async-trait = { workspace = true }
futures = { workspace = true }
# Stub streamable-HTTP MCP servers in the `mcp-http` integration tests.
axum = { workspace = true }
