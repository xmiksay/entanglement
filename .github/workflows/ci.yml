# PR / push gate (issue #107): run the full `make verify` CI-equivalent gate
# (check-fmt + tree + check-lean + lint + test) on every PR and every push to
# master. Puts the ADR-0006 (`tree`) and ADR-0025 (`check-lean`) hygiene gates
# under automation for the first time. Drives everything through `make`.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel superseded runs on the same ref (e.g. force-pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: make verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs exactly the pinned rust-toolchain.toml channel + components, so
      # CI runs the same compiler and clippy as a local `make verify`.
      - name: Install Rust toolchain
        run: rustup toolchain install && rustup show

      # Caches the registry, git deps, and target/ dir. Build jobs stay capped
      # at 4 via the committed .cargo/config.toml.
      - uses: Swatinem/rust-cache@v2

      - name: make verify
        run: make verify

      # Gate self-tests (#770): default tools (ubuntu's awk is mawk) and strict
      # POSIX, so a gate relying on a GNU extension can't pass vacuously.
      - name: make test-gates
        run: make test-gates

  # MSRV gate (#728): the workspace `rust-version` is a claim embedders rely on,
  # so typecheck on exactly that toolchain. `make msrv` reads the version from
  # Cargo.toml and installs it (rustup's `+<msrv>` override wins over the pinned
  # rust-toolchain.toml), so this job can't drift from the manifest.
  msrv:
    name: make msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .cargo/config.toml links with `-fuse-ld=lld`. Rust >= 1.90 ships its
      # own `ld.lld` (self-contained rust-lld), so the pinned job needs nothing;
      # the older MSRV toolchain does not, and the runner image has no lld.
      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      # Select the MSRV toolchain *before* rust-cache, which otherwise resolves
      # (and keys on) the pinned rust-toolchain.toml compiler. The version comes
      # from `make msrv-version`, i.e. Cargo.toml's rust-version.
      - name: Install MSRV toolchain
        run: |
          msrv=$(make -s msrv-version)
          rustup toolchain install "$msrv" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
          workspaces: ". -> target/msrv"

      - name: make msrv
        run: make msrv
